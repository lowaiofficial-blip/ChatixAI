<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ChatixAI - Ücretsiz Yapay Zeka</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { display: flex; background: #212121; color: #f3f4f6; }
    #sidebar { width: 280px; background: #171717; border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; height: 100%; position: fixed; left: 0; top: 0; z-index: 40; transform: translateX(-100%); transition: transform 0.3s ease-in-out; }
    @media (min-width: 768px) { #sidebar { position: relative; transform: translateX(0); } }
    #sidebar.open { transform: translateX(0); }
    main { flex: 1; display: flex; flex-direction: column; height: 100%; width: 100%; min-width: 0; }
    header { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(33,33,33,0.9); backdrop-filter: blur(12px); z-index: 10; position: relative; }
    #chatContainer { flex: 1; overflow-y: auto; overflow-x: hidden; width: 100%; }
    .input-area { flex-shrink: 0; padding: 0.75rem 1rem; border-top: 1px solid rgba(255,255,255,0.05); background: #212121; }
    #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 30; display: none; pointer-events: none; }
    #backdrop.show { display: block; pointer-events: auto; }
    @media (min-width: 768px) { #backdrop { display: none !important; } }
    #profileDropdown { position: absolute; right: 0; top: 100%; margin-top: 0.5rem; width: 16rem; background: #2f2f2f; border: 1px solid rgba(255,255,255,0.1); border-radius: 0.75rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); z-index: 100; overflow: hidden; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    .prose pre { background: #0d1117 !important; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.75rem 0; border: 1px solid rgba(255,255,255,0.1); }
    .prose code { font-family: 'Fira Code', monospace; font-size: 0.875em; background: rgba(255,255,255,0.05); padding: 0.125rem 0.375rem; border-radius: 0.25rem; }
    .prose pre code { background: transparent; padding: 0; }
    .prose p { margin-bottom: 0.75rem; line-height: 1.7; word-wrap: break-word; }
    .prose ul, .prose ol { margin-left: 1.5rem; margin-bottom: 0.75rem; }
    .prose li { margin-bottom: 0.25rem; line-height: 1.7; }
    .prose blockquote { border-left: 3px solid #10a37f; padding-left: 1rem; margin: 1rem 0; color: #9ca3af; font-style: italic; }
    .shimmer { background: linear-gradient(90deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,1) 50%, rgba(255,255,255,0.3) 100%); background-size: 200% 100%; animation: shimmer 1.5s infinite; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 500; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .typing-cursor::after { content: '|'; animation: blink 0.7s infinite; color: #10a37f; font-weight: bold; margin-left: 2px; }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .message-bubble { transition: all 0.2s ease; }
    .message-bubble:hover { background: rgba(255,255,255,0.02); }
    .input-container { transition: all 0.3s ease; }
    .input-container:focus-within { box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.2); }
    .btn-hover { transition: all 0.2s ease; }
    .btn-hover:hover { transform: translateY(-1px); }
    .btn-hover:active { transform: translateY(0); }
    
    /* Token Butonları */
    .token-actions { display: flex; gap: 0.75rem; margin-top: 1rem; }
    .token-btn { padding: 0.5rem 1.25rem; border-radius: 0.5rem; font-weight: 600; font-size: 0.875rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
    .token-btn-yes { background: #10a37f; color: white; border: 1px solid #10a37f; }
    .token-btn-yes:hover { background: #0d8a6a; }
    .token-btn-no { background: transparent; color: #ef4444; border: 1px solid #ef4444; }
    .token-btn-no:hover { background: rgba(239, 68, 68, 0.1); }
  </style>
</head>
<body>

  <div id="loginScreen" class="fixed inset-0 z-50 bg-[#212121] flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">
        <img src="https://i.imgur.com/0D0DKGI.png" class="h-16 w-16 mx-auto mb-4 object-contain" alt="ChatixAI">
        <h1 class="text-2xl font-bold mb-1">ChatixAI</h1>
        <p class="text-gray-400 text-sm">Ücretsiz yapay zeka asistanın</p>
      </div>
      <button id="googleBtn" onclick="googleLogin()" class="w-full flex items-center justify-center gap-3 bg-white text-gray-700 font-medium py-3 px-4 rounded-xl border border-gray-300 hover:bg-gray-50 transition mb-6 shadow-sm btn-hover">
        <svg class="h-5 w-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        <span id="googleBtnText">Google ile Giriş Yap</span>
      </button>
      <div class="flex items-center gap-3 mb-6"><div class="flex-1 h-px bg-white/10"></div><span class="text-xs text-gray-500">veya e-posta ile</span><div class="flex-1 h-px bg-white/10"></div></div>
      <div class="space-y-3">
        <input id="emailInput" type="email" autocomplete="off" placeholder="E-posta adresin" class="w-full bg-[#2f2f2f] px-4 py-3 rounded-xl border border-white/10 focus:outline-none focus:border-[#10a37f] text-sm transition">
        <input id="passwordInput" type="password" autocomplete="off" placeholder="Şifre (min 6 karakter)" class="w-full bg-[#2f2f2f] px-4 py-3 rounded-xl border border-white/10 focus:outline-none focus:border-[#10a37f] text-sm transition">
        <button id="loginBtn" onclick="emailLogin()" class="w-full bg-[#10a37f] hover:bg-[#0d8a6a] text-white font-medium py-3 rounded-xl transition text-sm flex items-center justify-center gap-2 btn-hover"><span id="loginBtnText">Giriş Yap</span></button>
        <button id="registerBtn" onclick="emailRegister()" class="w-full bg-white/5 hover:bg-white/10 text-white font-medium py-3 rounded-xl transition text-sm border border-white/10 flex items-center justify-center gap-2 btn-hover"><span id="registerBtnText">Hesap Oluştur</span></button>
      </div>
      <p id="loginError" class="text-red-400 text-sm text-center mt-4 hidden"></p>
    </div>
  </div>

  <div id="appScreen" class="hidden w-full h-full flex">
    <div id="backdrop" onclick="toggleSidebar()"></div>
    <aside id="sidebar">
      <div class="p-3 border-b border-white/5 flex items-center justify-between flex-shrink-0">
        <button onclick="newChat()" class="flex-1 flex items-center gap-2 px-3 py-2.5 rounded-lg hover:bg-white/10 transition text-left btn-hover">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          <span class="text-sm font-medium">Yeni Sohbet</span>
        </button>
        <button onclick="toggleSidebar()" class="md:hidden p-2 hover:bg-white/10 rounded-lg btn-hover">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="chatList" class="flex-1 overflow-y-auto scrollbar-thin p-2 space-y-1"></div>
      <div class="p-3 border-t border-white/5 flex-shrink-0">
        <div class="flex items-center gap-2 px-3 py-2 text-xs text-gray-500">
          <img src="https://i.imgur.com/0D0DKGI.png" class="h-4 w-4 object-contain" alt="Logo">
          <span>ChatixAI v1.0</span>
        </div>
      </div>
    </aside>

    <main>
      <header>
        <div class="flex items-center gap-3 flex-1 min-w-0">
          <button onclick="toggleSidebar()" class="md:hidden p-2 -ml-2 hover:bg-white/10 rounded-lg flex-shrink-0 btn-hover">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 class="font-semibold text-lg flex items-center gap-2 truncate">
            <img src="https://i.imgur.com/0D0DKGI.png" class="h-7 w-7 object-contain" alt="ChatixAI">
            <span class="hidden sm:inline">ChatixAI</span>
          </h1>
          
          <!-- 🪙 TOKEN GÖSTERGESİ -->
          <div class="hidden sm:flex items-center gap-1 bg-[#2f2f2f] px-3 py-1.5 rounded-full border border-white/10 mr-2">
            <span class="text-yellow-400 text-sm">🪙</span>
            <span id="userTokensDisplay" class="text-sm font-semibold text-white">0</span>
          </div>
        </div>
        
        <div class="relative flex-shrink-0">
          <button id="profileBtn" class="flex items-center gap-2 hover:bg-white/10 p-1.5 rounded-lg transition btn-hover">
            <img id="headerAvatar" src="" class="h-8 w-8 rounded-full border border-white/10 hidden object-cover" alt="Avatar">
            <div id="headerInitial" class="h-8 w-8 rounded-full bg-[#10a37f] flex items-center justify-center text-sm font-semibold hidden"></div>
          </button>
          <div id="profileDropdown" class="hidden">
            <div class="px-4 py-3 border-b border-white/5">
              <p class="text-sm font-medium text-white truncate" id="dropdownName">Kullanıcı</p>
              <p class="text-xs text-gray-400 truncate" id="dropdownEmail">email@example.com</p>
            </div>
            <button onclick="logout()" class="w-full text-left px-4 py-3 text-sm text-red-400 hover:bg-white/5 transition flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
              Çıkış Yap
            </button>
          </div>
        </div>
      </header>

      <div id="chatContainer" class="scrollbar-thin">
        <div id="welcome" class="h-full flex flex-col items-center justify-center text-center px-4">
          <img src="https://i.imgur.com/0D0DKGI.png" class="h-20 w-20 object-contain mb-6 opacity-90" alt="ChatixAI">
          <h2 class="text-2xl sm:text-3xl font-semibold mb-2">ChatixAI'ye Hoş Geldin</h2>
          <p class="text-gray-400 mb-8 text-sm sm:text-base max-w-md">Ücretsiz yapay zeka asistanın. Nasıl yardımcı olabilirim?</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full max-w-2xl">
            <button onclick="usePrompt('Bana Python ile basit bir hesap makinesi kodu yaz')" class="p-4 bg-[#2f2f2f] hover:bg-[#3a3a3a] rounded-xl text-left transition border border-white/5 group btn-hover">
              <div class="font-medium mb-1 text-sm sm:text-base group-hover:text-[#10a37f] transition">💻 Kod Yaz</div>
              <div class="text-xs sm:text-sm text-gray-400">Python ile hesap makinesi</div>
            </button>
            <button onclick="usePrompt('https://github.com sitesini özetle')" class="p-4 bg-[#2f2f2f] hover:bg-[#3a3a3a] rounded-xl text-left transition border border-white/5 group btn-hover">
              <div class="font-medium mb-1 text-sm sm:text-base group-hover:text-[#10a37f] transition">🌐 Web Arama</div>
              <div class="text-xs sm:text-sm text-gray-400">Site içeriğini oku</div>
            </button>
            <button onclick="usePrompt('Bana motivasyonel bir şiir yaz')" class="p-4 bg-[#2f2f2f] hover:bg-[#3a3a3a] rounded-xl text-left transition border border-white/5 group btn-hover">
              <div class="font-medium mb-1 text-sm sm:text-base group-hover:text-[#10a37f] transition">✍️ Yaratıcı Yazı</div>
              <div class="text-xs sm:text-sm text-gray-400">Motivasyonel bir şiir</div>
            </button>
            <button onclick="usePrompt('İngilizce öğrenmek için günlük 5 cümle öner')" class="p-4 bg-[#2f2f2f] hover:bg-[#3a3a3a] rounded-xl text-left transition border border-white/5 group btn-hover">
              <div class="font-medium mb-1 text-sm sm:text-base group-hover:text-[#10a37f] transition">🌍 Dil Öğren</div>
              <div class="text-xs sm:text-sm text-gray-400">İngilizce günlük cümleler</div>
            </button>
          </div>
        </div>
        <div id="messages" class="w-full max-w-3xl mx-auto px-4 sm:px-6 py-6 space-y-6 hidden pb-4"></div>
      </div>

      <div class="input-area">
        <div class="w-full max-w-3xl mx-auto">
          <div class="input-container relative bg-[#2f2f2f] rounded-2xl border border-white/10 shadow-lg">
            <textarea id="userInput" rows="1" placeholder="ChatixAI'ye bir şey sor..." class="w-full bg-transparent px-4 py-3 sm:py-4 pr-14 resize-none focus:outline-none max-h-32 text-sm sm:text-base leading-relaxed" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
            <button id="sendBtn" onclick="sendMessage()" class="absolute right-2 bottom-2 p-2.5 bg-white text-black rounded-xl hover:bg-gray-200 disabled:opacity-30 disabled:cursor-not-allowed transition flex items-center justify-center btn-hover">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 12l14-7-7 17-3-7-4-3z"/></svg>
            </button>
          </div>
          <p class="text-[10px] sm:text-xs text-gray-500 text-center mt-2.5">ChatixAI hata yapabilir. Önemli bilgileri doğrulayın.</p>
        </div>
      </div>
    </main>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, deleteDoc, getDocs, getDoc, query, orderBy, serverTimestamp, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAV4b57NxJ8WyClKAq-WbGO3eW4VPnJPts",
    authDomain: "chatixai.firebaseapp.com",
    projectId: "chatixai",
    storageBucket: "chatixai.firebasestorage.app",
    messagingSenderId: "330931946688",
    appId: "1:330931946688:web:efb2e12d122aec462d5925",
    measurementId: "G-85XT90EG2C"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let chats = {};
  let currentChatId = null;
  let isGenerating = false;
  let userInitialChar = 'U';
  let userTokens = 0;
  let pendingAgentTask = null; // Bekleyen agent görevi

  marked.setOptions({
    highlight: (code, lang) => {
      if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
      return hljs.highlightAuto(code).value;
    },
    breaks: true
  });

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      userInitialChar = (user.displayName ? user.displayName[0] : (user.email ? user.email[0] : 'U')).toUpperCase();
      showApp();
      
      try {
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        const now = Date.now();
        let newTokens = 10;
        let lastReset = now;

        if (userSnap.exists()) {
          const data = userSnap.data();
          lastReset = data.lastTokenReset?.toDate?.()?.getTime() || 0;
          if (now - lastReset > 86400000) {
            newTokens = (data.tokens || 0) + 10;
            lastReset = now;
          } else {
            newTokens = data.tokens || 0;
          }
        }

        userTokens = newTokens;
        updateTokenDisplay();

        await setDoc(userRef, {
          email: user.email,
          displayName: user.displayName || user.email.split('@')[0],
          tokens: userTokens,
          lastTokenReset: new Date(lastReset),
          lastLogin: serverTimestamp()
        }, { merge: true });

      } catch (err) {
        console.error('Profil/Token hatası:', err);
      }
      
      try { await loadUserChats(); } catch (err) { console.error('Sohbetler yüklenemedi:', err); }
      newChat();
    } else {
      currentUser = null;
      chats = {};
      currentChatId = null;
      userTokens = 0;
      showLogin();
    }
  });

  function updateTokenDisplay() {
    const tokenEl = document.getElementById('userTokensDisplay');
    if (tokenEl) tokenEl.textContent = userTokens;
  }

  function showLogin() {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('appScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('flex');
    document.getElementById('emailInput').value = '';
    document.getElementById('passwordInput').value = '';
    hideLoading();
  }

  function showApp() {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('appScreen').classList.add('flex');
    const avatar = document.getElementById('headerAvatar');
    const initial = document.getElementById('headerInitial');
    document.getElementById('dropdownName').textContent = currentUser.displayName || 'Kullanıcı';
    document.getElementById('dropdownEmail').textContent = currentUser.email || '';
    if (currentUser.photoURL) {
      avatar.src = currentUser.photoURL;
      avatar.classList.remove('hidden');
      initial.classList.add('hidden');
    } else {
      avatar.classList.add('hidden');
      initial.classList.remove('hidden');
      initial.textContent = userInitialChar;
    }
  }

  function showLoading(btnId, textId, loadingText) {
    const btn = document.getElementById(btnId);
    const text = document.getElementById(textId);
    btn.disabled = true;
    btn.style.opacity = '0.6';
    text.innerHTML = `<span class="spinner"></span> ${loadingText}`;
  }

  function hideLoading() {
    ['googleBtn', 'loginBtn', 'registerBtn'].forEach(id => {
      const btn = document.getElementById(id);
      btn.disabled = false;
      btn.style.opacity = '1';
    });
    document.getElementById('googleBtnText').textContent = 'Google ile Giriş Yap';
    document.getElementById('loginBtnText').textContent = 'Giriş Yap';
    document.getElementById('registerBtnText').textContent = 'Hesap Oluştur';
  }

  window.googleLogin = async () => {
    showLoading('googleBtn', 'googleBtnText', 'Giriş yapılıyor...');
    try { await signInWithPopup(auth, new GoogleAuthProvider()); } 
    catch (err) { showLoginError('Google girişi başarısız.'); hideLoading(); }
  };

  window.emailLogin = async () => {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    if (!email || !password) return showLoginError('E-posta ve şifre gerekli');
    showLoading('loginBtn', 'loginBtnText', 'Giriş yapılıyor...');
    try { await signInWithEmailAndPassword(auth, email, password); } 
    catch (err) { showLoginError('Giriş başarısız.'); hideLoading(); }
  };

  window.emailRegister = async () => {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    if (!email || !password) return showLoginError('E-posta ve şifre gerekli');
    if (password.length < 6) return showLoginError('Şifre en az 6 karakter olmalı');
    showLoading('registerBtn', 'registerBtnText', 'Hesap oluşturuluyor...');
    try { await createUserWithEmailAndPassword(auth, email, password); } 
    catch (err) { showLoginError('Kayıt başarısız.'); hideLoading(); }
  };

  window.logout = async () => {
    document.getElementById('profileDropdown').classList.add('hidden');
    try { await signOut(auth); } catch (err) { console.error('Çıkış hatası:', err); }
    chats = {}; currentChatId = null; isGenerating = false; pendingAgentTask = null;
    document.getElementById('messages').innerHTML = '';
    document.getElementById('chatList').innerHTML = '';
  };

  function showLoginError(msg) {
    const el = document.getElementById('loginError');
    el.textContent = msg;
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 5000);
  }

  document.getElementById('profileBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('profileDropdown').classList.toggle('hidden');
  });

  document.addEventListener('click', (e) => {
    const dropdown = document.getElementById('profileDropdown');
    const profileBtn = document.getElementById('profileBtn');
    if (!dropdown.classList.contains('hidden') && !dropdown.contains(e.target) && !profileBtn.contains(e.target)) {
      dropdown.classList.add('hidden');
    }
  });

  window.loadUserChats = async () => {
    if (!currentUser) return;
    chats = {};
    try {
      const snapshot = await getDocs(query(collection(db, "users", currentUser.uid, "chats"), orderBy("createdAt", "desc")));
      snapshot.forEach(docSnap => { chats[docSnap.id] = docSnap.data(); });
      renderChatList();
    } catch (err) { console.error('Sohbetler yüklenemedi:', err); renderChatList(); }
  };

  window.saveChatToFirestore = async (chatId) => {
    if (!currentUser || !chats[chatId]) return;
    try { await setDoc(doc(db, "users", currentUser.uid, "chats", chatId), chats[chatId]); } 
    catch (err) { console.error('Kaydetme hatası:', err); }
  };

  window.deleteChatFromFirestore = async (chatId) => {
    if (!currentUser) return;
    try { await deleteDoc(doc(db, "users", currentUser.uid, "chats", chatId)); } 
    catch (err) { console.error('Silme hatası:', err); }
  };

  window.toggleSidebar = () => {
    if (window.innerWidth < 768) {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('backdrop').classList.toggle('show');
    }
  };

  window.newChat = () => {
    currentChatId = null;
    isGenerating = false;
    pendingAgentTask = null;
    document.getElementById('welcome').classList.remove('hidden');
    const messagesDiv = document.getElementById('messages');
    messagesDiv.classList.add('hidden');
    messagesDiv.innerHTML = '';
    const input = document.getElementById('userInput');
    input.value = '';
    autoResize(input);
    document.getElementById('sendBtn').disabled = false;
    renderChatList();
    if (window.innerWidth < 768) {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('backdrop').classList.remove('show');
    }
  };

  window.renderChatList = () => {
    const chatList = document.getElementById('chatList');
    chatList.innerHTML = '';
    const chatIds = Object.keys(chats);
    if (chatIds.length === 0) {
      chatList.innerHTML = '<div class="text-center text-gray-500 text-sm mt-4 px-2">Henüz sohbet yok</div>';
      return;
    }
    chatIds.forEach(id => {
      const chat = chats[id];
      const div = document.createElement('div');
      div.className = `flex items-center justify-between px-3 py-2.5 rounded-lg cursor-pointer group transition mb-1 ${id === currentChatId ? 'bg-white/10 border border-white/5' : 'hover:bg-white/5 border border-transparent'} btn-hover`;
      div.innerHTML = `
        <span class="text-sm truncate flex-1 pr-2 select-none" onclick="loadChat('${id}')">${chat.title}</span>
        <button onclick="deleteChat('${id}', event)" class="opacity-0 group-hover:opacity-100 p-1.5 hover:bg-red-500/20 hover:text-red-400 rounded transition flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </button>`;
      chatList.appendChild(div);
    });
  };

  window.loadChat = (chatId) => {
    currentChatId = chatId;
    const chat = chats[chatId];
    if (!chat) return;
    document.getElementById('welcome').classList.add('hidden');
    const messagesDiv = document.getElementById('messages');
    messagesDiv.classList.remove('hidden');
    messagesDiv.innerHTML = '';
    chat.messages.forEach(msg => appendMessage(msg.role, msg.content, false));
    renderChatList();
    scrollToBottom();
    if (window.innerWidth < 768) {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('backdrop').classList.remove('show');
    }
  };

  window.deleteChat = async (chatId, event) => {
    event.stopPropagation();
    if (!confirm('Bu sohbeti silmek istediğine emin misin?')) return;
    delete chats[chatId];
    await deleteChatFromFirestore(chatId);
    if (currentChatId === chatId) newChat();
    else renderChatList();
  };

  function appendMessage(role, content, animate = true) {
    const messagesDiv = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `message-bubble flex gap-3 sm:gap-4 w-full p-3 rounded-xl ${animate ? 'fade-in' : ''}`;
    
    const avatar = role === 'user'
      ? `<div class="w-8 h-8 rounded-full bg-[#10a37f] flex items-center justify-center text-sm font-semibold flex-shrink-0">${userInitialChar}</div>`
      : '<img src="https://i.imgur.com/0D0DKGI.png" class="w-8 h-8 rounded-full object-contain bg-white/10 p-1 flex-shrink-0 border border-white/10" alt="AI">';
      
    // TOKEN REQUEST PARSER
    let displayContent = content;
    let tokenButtons = '';
    const tokenMatch = content.match(/\[TOKEN_REQUEST:(\d+)\]([\s\S]*)/);
    
    if (tokenMatch && role === 'assistant') {
      const cost = tokenMatch[1];
      const message = tokenMatch[2].trim();
      displayContent = message;
      
      // Bekleyen görevi kaydet (URL ve prompt'u mesajdan çıkarmak basit bir yaklaşımdır, 
      // idealde kullanıcı son mesajını referans alır)
      pendingAgentTask = { cost: parseInt(cost), prompt: "Kullanıcının son isteğini gerçekleştir" };
      
      tokenButtons = `
        <div class="token-actions">
          <button onclick="confirmAgentTask(true)" class="token-btn token-btn-yes">✅ Evet, Başlat</button>
          <button onclick="confirmAgentTask(false)" class="token-btn token-btn-no">❌ Hayır, İptal</button>
        </div>
      `;
    }

    div.innerHTML = `
      ${avatar}
      <div class="flex-1 min-w-0 prose prose-invert max-w-none text-sm sm:text-base">
        ${role === 'user' ? `<p class="whitespace-pre-wrap">${escapeHtml(displayContent)}</p>` : marked.parse(displayContent)}
        ${tokenButtons}
      </div>
    `;
    messagesDiv.appendChild(div);
    scrollToBottom();
    return div;
  }

  // 🪙 TOKEN ONAY MEKANİZMASI
  window.confirmAgentTask = async (approved) => {
    if (!approved) {
      appendMessage('assistant', 'Tamam, işlem iptal edildi. Başka nasıl yardımcı olabilirim?');
      pendingAgentTask = null;
      return;
    }

    if (!pendingAgentTask || userTokens < pendingAgentTask.cost) {
      appendMessage('assistant', `🪙 Üzgünüm, bu işlem için yeterli tokenin yok. (Gerekli: ${pendingAgentTask?.cost || 100}, Mevcut: ${userTokens})`);
      return;
    }

    // Son kullanıcı mesajını al
    const lastUserMsg = chats[currentChatId].messages.filter(m => m.role === 'user').pop();
    const prompt = lastUserMsg ? lastUserMsg.content : "Kullanıcının isteğini yerine getir";
    
    // UI'ı güncelle
    const actionDiv = document.querySelector('.token-actions');
    if (actionDiv) {
      actionDiv.innerHTML = '<span class="text-sm text-yellow-400 flex items-center gap-2"><span class="spinner" style="width:16px;height:16px;border-width:2px;"></span> Manus aracı başlatılıyor, bu 1-2 dakika sürebilir...</span>';
    }

    try {
      const response = await fetch('/api/execute-agent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          userId: currentUser.uid,
          prompt: prompt,
          url: extractUrl(prompt),
          cost: pendingAgentTask.cost
        })
      });

      const result = await response.json();

      if (result.success) {
        // Token'ı frontend'de de güncelle (Backend zaten güncelledi)
        userTokens -= result.tokensDeducted;
        updateTokenDisplay();
        await updateDoc(doc(db, "users", currentUser.uid), {
          tokens: increment(-result.tokensDeducted)
        });

        appendMessage('assistant', `✅ **İşlem Başarıyla Tamamlandı!**\n\n${result.message}\n\n*Kalan Token: ${userTokens}*`);
      } else {
        appendMessage('assistant', `❌ **Hata:** ${result.error}\n\nTokeniniz iade edildi.`);
      }
    } catch (error) {
      appendMessage('assistant', '❌ Sunucu hatası oluştu, lütfen tekrar deneyin.');
    } finally {
      pendingAgentTask = null;
    }
  };

  function extractUrl(message) {
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    const matches = message.match(urlRegex);
    return matches ? matches[0] : null;
  }

  window.sendMessage = async () => {
    const input = document.getElementById('userInput');
    const message = input.value.trim();
    if (!message || isGenerating) return;

    isGenerating = true;
    document.getElementById('sendBtn').disabled = true;
    input.value = '';
    autoResize(input);

    document.getElementById('welcome').classList.add('hidden');
    document.getElementById('messages').classList.remove('hidden');

    if (!currentChatId || !chats[currentChatId]) {
      currentChatId = Date.now().toString();
      chats[currentChatId] = {
        title: message.length > 30 ? message.substring(0, 30) + '...' : message,
        messages: [],
        createdAt: serverTimestamp()
      };
    }

    chats[currentChatId].messages.push({ role: 'user', content: message });
    appendMessage('user', message);
    renderChatList();

    const assistantDiv = appendMessage('assistant', '', true);
    const contentDiv = assistantDiv.querySelector('.prose');
    
    contentDiv.innerHTML = `
      <div class="flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
        </svg>
        <span class="shimmer">Düşünüyorum...</span>
      </div>
    `;

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          messages: chats[currentChatId].messages,
          userTokens: userTokens
        })
      });

      if (!response.ok) throw new Error('API hatası');

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let fullContent = '';

      contentDiv.innerHTML = '<span class="typing-cursor"></span>';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        
        const chunk = decoder.decode(value);
        const lines = chunk.split('\n').filter(line => line.trim() !== '');
        
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const data = line.slice(6);
            if (data === '[DONE]') continue;
            try {
              const parsed = JSON.parse(data);
              if (parsed.content) {
                fullContent += parsed.content;
                
                // Eğer token request geldiyse, anında render et
                if (fullContent.includes('[TOKEN_REQUEST:')) {
                   // Geçici olarak cursor'ı kaldır, butonlar appendMessage'da eklenecek
                } else {
                   contentDiv.innerHTML = marked.parse(fullContent) + '<span class="typing-cursor"></span>';
                }
                scrollToBottom();
              }
            } catch (e) {}
          }
        }
      }

      // Final render (Token butonları burada devreye girecek)
      assistantDiv.remove(); // Eski geçici div'i sil
      appendMessage('assistant', fullContent, false); // Butonlu halini ekle

      chats[currentChatId].messages.push({ role: 'assistant', content: fullContent });
      await saveChatToFirestore(currentChatId);
      renderChatList();

    } catch (error) {
      console.error(error);
      assistantDiv.innerHTML = '<p class="text-red-400 bg-red-400/10 p-3 rounded-lg border border-red-400/20">Bağlantı hatası oluştu.</p>';
    } finally {
      isGenerating = false;
      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }
  };

  window.usePrompt = (prompt) => {
    document.getElementById('userInput').value = prompt;
    sendMessage();
  };

  window.handleKey = (event) => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  };

  window.autoResize = (textarea) => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 128) + 'px';
  };

  window.scrollToBottom = () => {
    const container = document.getElementById('chatContainer');
    setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
  };

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
</script>

</body>
</html>
