<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatixAI - Ücretsiz Yapay Zeka</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    .prose pre { background: #0d1117 !important; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.75rem 0; }
    .prose code { font-family: 'Fira Code', monospace; font-size: 0.9em; }
    .prose p { margin-bottom: 0.75rem; line-height: 1.7; }
    .prose ul, .prose ol { margin-left: 1.5rem; margin-bottom: 0.75rem; }
    .prose li { margin-bottom: 0.25rem; }
    .typing::after { content: '▊'; animation: blink 1s infinite; color: #10a37f; }
    @keyframes blink { 50% { opacity: 0; } }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-[#212121] text-gray-100 h-screen flex overflow-hidden">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="w-64 bg-[#171717] flex flex-col border-r border-white/5 transition-all">
    <div class="p-3 border-b border-white/5">
      <button onclick="newChat()" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-white/10 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        <span class="text-sm">Yeni Sohbet</span>
      </button>
    </div>
    <div id="chatList" class="flex-1 overflow-y-auto scrollbar-thin p-2 space-y-1"></div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col">
    <!-- HEADER -->
    <header class="flex items-center justify-between px-4 py-3 border-b border-white/5">
      <button onclick="toggleSidebar()" class="p-2 hover:bg-white/10 rounded-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <h1 class="font-semibold text-lg flex items-center gap-2">
        <span class="text-[#10a37f]">✦</span> ChatixAI
      </h1>
      <select id="modelSelect" class="bg-[#2f2f2f] text-sm px-3 py-1.5 rounded-lg border border-white/10 focus:outline-none">
        <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
        <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
        <option value="google/gemini-2.0-flash-exp:free">Gemini 2.0 Flash</option>
        <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B (Free)</option>
        <option value="deepseek/deepseek-chat-v3.1:free">DeepSeek V3 (Free)</option>
        <option value="qwen/qwen-2.5-72b-instruct:free">Qwen 2.5 72B (Free)</option>
      </select>
    </header>

    <!-- CHAT -->
    <div id="chatContainer" class="flex-1 overflow-y-auto scrollbar-thin">
      <div id="welcome" class="h-full flex flex-col items-center justify-center text-center px-4">
        <div class="text-5xl mb-4">✦</div>
        <h2 class="text-2xl font-semibold mb-2">ChatixAI'ye Hoş Geldin</h2>
        <p class="text-gray-400 mb-8">Ücretsiz yapay zeka asistanın. Nasıl yardımcı olabilirim?</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-2xl w-full">
          <button onclick="usePrompt('Bana Python ile basit bir hesap makinesi kodu yaz')" class="p-4 bg-[#2f2f2f] hover:bg-[#3a3a3a] rounded-xl text-left transition">
            <div class="font-medium mb-1">💻 Kod Yaz</div>
            <div class="text-sm text-gray-400">Python ile hesap makinesi</div>
          </button>
          <button onclick="usePrompt('Yapay zeka nedir, basitçe açıkla')" class="p-4 bg-[#2f2f2f] hover:bg-[#3a3a3a] rounded-xl text-left transition">
            <div class="font-medium mb-1">📚 Açıkla</div>
            <div class="text-sm text-gray-400">Yapay zeka nedir?</div>
          </button>
          <button onclick="usePrompt('Bana motivasyonel bir şiir yaz')" class="p-4 bg-[#2f2f2f] hover:bg-[#3a3a3a] rounded-xl text-left transition">
            <div class="font-medium mb-1">✍️ Yaratıcı Yazı</div>
            <div class="text-sm text-gray-400">Motivasyonel bir şiir</div>
          </button>
          <button onclick="usePrompt('İngilizce öğrenmek için günlük 5 cümle öner')" class="p-4 bg-[#2f2f2f] hover:bg-[#3a3a3a] rounded-xl text-left transition">
            <div class="font-medium mb-1">🌍 Dil Öğren</div>
            <div class="text-sm text-gray-400">İngilizce günlük cümleler</div>
          </button>
        </div>
      </div>
      <div id="messages" class="max-w-3xl mx-auto px-4 py-6 space-y-6 hidden"></div>
    </div>

    <!-- INPUT -->
    <div class="p-4 border-t border-white/5">
      <div class="max-w-3xl mx-auto">
        <div class="relative bg-[#2f2f2f] rounded-2xl border border-white/10 focus-within:border-white/30 transition">
          <textarea id="userInput" rows="1" placeholder="ChatixAI'ye bir şey sor..."
            class="w-full bg-transparent px-4 py-3 pr-12 resize-none focus:outline-none max-h-40"
            onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          <button id="sendBtn" onclick="sendMessage()" class="absolute right-2 bottom-2 p-2 bg-white text-black rounded-lg hover:bg-gray-200 disabled:opacity-30 disabled:cursor-not-allowed transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 12l14-7-7 17-3-7-4-3z"/>
            </svg>
          </button>
        </div>
        <p class="text-xs text-gray-500 text-center mt-2">ChatixAI hata yapabilir. Önemli bilgileri doğrulayın.</p>
      </div>
    </div>
  </main>

<script>
// State
let chats = JSON.parse(localStorage.getItem('chatixai_chats') || '{}');
let currentChatId = null;
let isGenerating = false;

// Markdown ayarları
marked.setOptions({
  highlight: (code, lang) => {
    if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
    return hljs.highlightAuto(code).value;
  },
  breaks: true
});

// Sayfa yüklendiğinde
document.addEventListener('DOMContentLoaded', () => {
  renderChatList();
  if (Object.keys(chats).length > 0) {
    loadChat(Object.keys(chats)[0]);
  }
});

// Sidebar toggle
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('hidden');
}

// Yeni sohbet
function newChat() {
  currentChatId = null;
  document.getElementById('welcome').classList.remove('hidden');
  document.getElementById('messages').classList.add('hidden');
  document.getElementById('messages').innerHTML = '';
  document.getElementById('userInput').value = '';
}

// Sohbet listesi render
function renderChatList() {
  const chatList = document.getElementById('chatList');
  chatList.innerHTML = '';
  
  Object.entries(chats).forEach(([id, chat]) => {
    const div = document.createElement('div');
    div.className = `flex items-center justify-between px-3 py-2 rounded-lg hover:bg-white/10 cursor-pointer group ${id === currentChatId ? 'bg-white/10' : ''}`;
    div.innerHTML = `
      <span class="text-sm truncate flex-1" onclick="loadChat('${id}')">${chat.title}</span>
      <button onclick="deleteChat('${id}', event)" class="opacity-0 group-hover:opacity-100 p-1 hover:bg-white/20 rounded transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    `;
    chatList.appendChild(div);
  });
}

// Sohbet yükle
function loadChat(chatId) {
  currentChatId = chatId;
  const chat = chats[chatId];
  if (!chat) return;

  document.getElementById('welcome').classList.add('hidden');
  const messagesDiv = document.getElementById('messages');
  messagesDiv.classList.remove('hidden');
  messagesDiv.innerHTML = '';

  chat.messages.forEach(msg => {
    appendMessage(msg.role, msg.content, false);
  });

  renderChatList();
  scrollToBottom();
}

// Sohbet sil
function deleteChat(chatId, event) {
  event.stopPropagation();
  delete chats[chatId];
  localStorage.setItem('chatixai_chats', JSON.stringify(chats));
  if (currentChatId === chatId) {
    newChat();
  }
  renderChatList();
}

// Mesaj ekle
function appendMessage(role, content, animate = true) {
  const messagesDiv = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `flex gap-4 ${animate ? 'fade-in' : ''}`;
  
  const avatar = role === 'user' 
    ? '<div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-sm font-semibold">U</div>'
    : '<div class="w-8 h-8 rounded-full bg-[#10a37f] flex items-center justify-center text-sm">✦</div>';

  div.innerHTML = `
    ${avatar}
    <div class="flex-1 prose prose-invert max-w-none">
      ${role === 'user' ? `<p>${escapeHtml(content)}</p>` : marked.parse(content)}
    </div>
  `;

  messagesDiv.appendChild(div);
  scrollToBottom();
  return div;
}

// Mesaj gönder
async function sendMessage() {
  const input = document.getElementById('userInput');
  const message = input.value.trim();
  if (!message || isGenerating) return;

  isGenerating = true;
  document.getElementById('sendBtn').disabled = true;
  input.value = '';
  autoResize(input);

  // Welcome ekranını gizle
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('messages').classList.remove('hidden');

  // Yeni sohbet ise oluştur
  if (!currentChatId) {
    currentChatId = Date.now().toString();
    chats[currentChatId] = {
      title: message.substring(0, 30),
      messages: []
    };
  }

  // Kullanıcı mesajını ekle
  chats[currentChatId].messages.push({ role: 'user', content: message });
  appendMessage('user', message);

  // Assistant placeholder
  const assistantDiv = appendMessage('assistant', '', true);
  const contentDiv = assistantDiv.querySelector('.prose');
  contentDiv.innerHTML = '<span class="typing"></span>';

  // API'ye gönder
  const model = document.getElementById('modelSelect').value;
  
  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: chats[currentChatId].messages,
        model: model
      })
    });

    if (!response.ok) {
      throw new Error('API hatası');
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value);
      const lines = chunk.split('\n').filter(line => line.trim() !== '');

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);
          if (data === '[DONE]') continue;

          try {
            const parsed = JSON.parse(data);
            if (parsed.content) {
              fullContent += parsed.content;
              contentDiv.innerHTML = marked.parse(fullContent);
              scrollToBottom();
            }
          } catch (e) {}
        }
      }
    }

    // Sohbeti kaydet
    chats[currentChatId].messages.push({ role: 'assistant', content: fullContent });
    localStorage.setItem('chatixai_chats', JSON.stringify(chats));
    renderChatList();

  } catch (error) {
    contentDiv.innerHTML = '<p class="text-red-400">Hata oluştu. Lütfen tekrar deneyin.</p>';
  } finally {
    isGenerating = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

// Önerilen prompt kullan
function usePrompt(prompt) {
  document.getElementById('userInput').value = prompt;
  sendMessage();
}

// Keyboard handler
function handleKey(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

// Textarea otomatik boyut
function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
}

// Scroll en alta
function scrollToBottom() {
  const container = document.getElementById('chatContainer');
  container.scrollTop = container.scrollHeight;
}

// HTML escape
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
</script>

</body>
</html>
